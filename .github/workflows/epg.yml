name: EPG Grab

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lxml,yaml]"
          pip install curl_cffi || echo "curl_cffi skipped, KT may fail"

      - name: Grab EPG
        run: python -m epg2xml run --xmlfile guide-kr.xml --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-xml
          path: guide-kr.xml

      - name: Publish to Release
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: epg-latest
          files: guide-kr.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}