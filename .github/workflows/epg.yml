name: EPG Grab

on:
  workflow_dispatch:        # 手动触发
  schedule:
    - cron: "0 18 * * *"    # 每天 UTC 18:00（北京凌晨 2 点）抓一次

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" || pip install requests beautifulsoup4 lxml PyYAML curl_cffi

      - name: Update channels
        run: python -m epg2xml update_channels

      - name: Grab EPG
        run: python -m epg2xml run --xmlfile guide-kr.xml --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: epg-xml
          path: guide-kr.xml